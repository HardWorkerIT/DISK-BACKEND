version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: diskapi-postgres
    environment:
      POSTGRES_DB: diskapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diskapi-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diskapi-app
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=diskapi;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - diskapi-network

volumes:
  postgres_data:

networks:
  diskapi-network:
    driver: bridge

